<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALL PO ONE — 포켓몬 · 원피스 미개봉 박스 &amp; 오리파</title>
<meta name="description" content="ALL PO ONE(올포원) — 포켓몬 · 원피스 미개봉 박스와 오리파를 유튜브 라이브로 실시간 개봉·판매합니다. 잔여 수량과 당첨 라인업을 확인하고 카카오톡 오픈톡으로 참여하세요." />
<meta name="theme-color" content="#07080b" />
<meta property="og:title" content="ALL PO ONE — 포켓몬 · 원피스 미개봉 박스 &amp; 오리파" />
<meta property="og:description" content="ALL PO ONE(올포원) — 미개봉 박스 &amp; 오리파. 유튜브 라이브로 실시간 개봉·판매합니다." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ALL PO ONE" />
<meta property="og:image" content="https://allpoone.github.io/cards/logo.png" />
<meta property="og:image:width" content="1254" />
<meta property="og:image:height" content="1254" />
<meta property="og:image:alt" content="ALL PO ONE 로고" />
<link rel="icon" type="image/png" sizes="160x160" href="logo-160.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="styles.css?v=202611160028" />
</head>
<body>
<a class="skip-link" href="#products">상품 목록으로 건너뛰기</a>

<!-- 샘플 데이터 안내 (cards.js 의 showSampleBanner 로 끌 수 있음) -->
<div class="sample-banner" id="sampleBanner" hidden>
  <span class="sample-banner__dot" aria-hidden="true"></span>
  <span id="sampleBannerText"></span>
</div>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="#top">
      <img class="brand__logo" src="logo-160.png" alt="ALL PO ONE 로고" width="40" height="40" decoding="async" />
      <span class="brand__text">
        <strong id="shopName">ALL PO ONE</strong>
        <small id="shopNameKo">올포원</small>
      </span>
    </a>

    <div class="header-actions">
      <div class="game-badges" role="group" aria-label="종목 바로가기">
        <button class="badge badge--poke" type="button" data-game-filter="pokemon" aria-pressed="false">Pokémon</button>
        <button class="badge badge--one" type="button" data-game-filter="onepiece" aria-pressed="false">One Piece</button>
      </div>
      <button class="btn btn--kakao btn--sm" type="button" data-inquire>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 2.8 6.2 2.8 10.2c0 2.6 1.6 4.8 4.1 6.1-.2.7-.7 2.5-.8 2.9 0 0-.1.4.2.5.3.1.5 0 .5 0 .6-.4 2.6-1.7 3.2-2.1.6.1 1.3.1 2 .1 5.1 0 9.2-3.2 9.2-7.2S17.1 3 12 3z"/></svg>
        오픈톡 문의
      </button>
    </div>
  </div>
</header>

<main id="top">
  <!-- ── 히어로 ───────────────────────────────────────────── -->
  <section class="hero wrap">
    <p class="hero__eyebrow">ALL PO ONE · SEALED BOX &amp; ORIPA · 유튜브 라이브 개봉</p>
    <h1 class="hero__title">
      뜯기 전에, 제대로 확인하는<br />
      <span class="hero__title-em">미개봉 박스 &amp; 오리파</span>
    </h1>
    <p class="hero__desc" id="intro"></p>

    <div class="hero__stats">
      <div class="stat">
        <strong id="statTotal">0</strong>
        <span>등록 상품</span>
      </div>
      <div class="stat">
        <strong id="statAvailable">0</strong>
        <span>판매 가능</span>
      </div>
      <div class="stat">
        <strong id="statOripa">0</strong>
        <span>오리파</span>
      </div>
    </div>

    <div class="hero__cta">
      <a class="btn btn--ghost" href="#products">상품 둘러보기</a>
      <button class="btn btn--kakao" type="button" data-inquire>오픈톡 참여 문의</button>
      <a class="btn btn--yt" id="ytLink" href="#" target="_blank" rel="noopener noreferrer" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M21.6 7.2c-.2-.9-.9-1.6-1.8-1.8C18 5 12 5 12 5s-6 0-7.8.4c-.9.2-1.6.9-1.8 1.8C2 9 2 12 2 12s0 3 .4 4.8c.2.9.9 1.6 1.8 1.8C6 19 12 19 12 19s6 0 7.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.8.4-4.8.4-4.8s0-3-.4-4.8zM10 15.5v-7l6 3.5-6 3.5z"/></svg>
        유튜브 라이브
      </a>
    </div>
  </section>

  <!-- ── 필터 & 검색 ──────────────────────────────────────── -->
  <section class="wrap controls" id="products" aria-label="상품 검색 및 필터">
    <div class="controls__top">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16.5 16.5 21 21"/></svg>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="박스명, 시리즈(예: 테라스탈, 500년 후의 미래), 오리파 이름 검색"
          aria-label="박스명, 시리즈, 오리파 이름 검색"
        />
        <button class="search__clear" id="searchClear" type="button" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <p class="controls__count" id="resultCount" role="status" aria-live="polite"></p>
    </div>

    <div class="filters">
      <div class="filter">
        <span class="filter__label">종목</span>
        <div class="chips" id="gameFilter" data-filter="game" role="group" aria-label="종목 필터"></div>
      </div>
      <div class="filter">
        <span class="filter__label">유형</span>
        <div class="chips" id="typeFilter" data-filter="type" role="group" aria-label="상품 유형 필터"></div>
      </div>
      <div class="filter">
        <span class="filter__label">판본</span>
        <div class="chips" id="langFilter" data-filter="lang" role="group" aria-label="판본 필터"></div>
      </div>
      <div class="filter">
        <span class="filter__label">상태</span>
        <div class="chips" id="statusFilter" data-filter="status" role="group" aria-label="판매 상태 필터"></div>
      </div>
      <button class="btn btn--text" id="resetFilters" type="button">필터 초기화</button>
    </div>
  </section>

  <!-- ── 상품 그리드 ──────────────────────────────────────── -->
  <section class="wrap grid-section">
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty" id="emptyState" hidden>
      <p class="empty__title">조건에 맞는 상품이 없습니다</p>
      <p class="empty__desc">검색어를 줄이거나 필터를 초기화해 보세요.</p>
      <button class="btn btn--ghost btn--sm" type="button" id="emptyReset">필터 초기화</button>
    </div>
  </section>

  <!-- ── 진행 안내 ────────────────────────────────────────── -->
  <section class="wrap guide" id="guide">
    <div class="guide__head">
      <p class="guide__eyebrow">HOW IT WORKS</p>
      <h2 class="guide__title" id="guideTitle">진행 안내</h2>
      <p class="guide__intro" id="guideIntro"></p>
    </div>
    <div class="guide__grid" id="guideGrid"></div>
    <pre class="guide__notice" id="guideNotice"></pre>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__left">
      <strong id="footerShop"></strong>
      <p id="footerNote"></p>
    </div>
    <button class="btn btn--kakao btn--sm" type="button" data-inquire>오픈톡 문의</button>
  </div>
</footer>

<!-- ── 상세 모달 ──────────────────────────────────────────── -->
<div class="modal" id="detailModal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close" type="button" data-close aria-label="닫기">×</button>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<!-- ── 토스트 ─────────────────────────────────────────────── -->
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<script src="cards.js?v=202611160028"></script>
<script src="app.js?v=202611160028"></script>
</body>
</html>
