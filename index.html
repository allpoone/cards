<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALL PO ONE — 포켓몬 · 원피스 카드 컬렉션</title>
<meta name="description" content="ALL PO ONE(올포원) — 포켓몬 · 원피스 트레이딩 카드 컬렉션을 한 장씩 정리해 판매합니다. 등급·인증번호·가격을 확인하고 카카오톡 오픈톡으로 문의하세요." />
<meta name="theme-color" content="#07080b" />
<meta property="og:title" content="ALL PO ONE — 포켓몬 · 원피스 카드 컬렉션" />
<meta property="og:description" content="ALL PO ONE(올포원) — 포켓몬 · 원피스 카드 컬렉션 정리 판매. 등급과 인증번호를 확인하고 오픈톡으로 문의하세요." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Crect x='16' y='10' width='32' height='44' rx='5' fill='none' stroke='%23e3c07a' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23e3c07a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<a class="skip-link" href="#cards">카드 목록으로 건너뛰기</a>

<!-- 샘플 데이터 안내 (cards.js 의 showSampleBanner 로 끌 수 있음) -->
<div class="sample-banner" id="sampleBanner" hidden>
  <span class="sample-banner__dot" aria-hidden="true"></span>
  <span id="sampleBannerText"></span>
</div>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="#top">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="26" height="26"><rect x="6" y="2" width="28" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="20" cy="20" r="5.5" fill="currentColor"/><path d="M6 12h28M6 28h28" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg>
      </span>
      <span class="brand__text">
        <strong id="shopName">ALL PO ONE</strong>
        <small id="shopNameKo">올포원</small>
      </span>
    </a>

    <div class="header-actions">
      <div class="game-badges" aria-label="취급 종목">
        <span class="badge badge--poke">Pokémon</span>
        <span class="badge badge--one">One Piece</span>
      </div>
      <button class="btn btn--kakao btn--sm" type="button" data-inquire>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 2.8 6.2 2.8 10.2c0 2.6 1.6 4.8 4.1 6.1-.2.7-.7 2.5-.8 2.9 0 0-.1.4.2.5.3.1.5 0 .5 0 .6-.4 2.6-1.7 3.2-2.1.6.1 1.3.1 2 .1 5.1 0 9.2-3.2 9.2-7.2S17.1 3 12 3z"/></svg>
        오픈톡 문의
      </button>
    </div>
  </div>
</header>

<main id="top">
  <!-- ── 히어로 ───────────────────────────────────────────── -->
  <section class="hero wrap">
    <p class="hero__eyebrow">ALL PO ONE · COLLECTOR'S VAULT · 개인 컬렉션 정리 판매</p>
    <h1 class="hero__title">
      한 장씩, 제대로 넘기는<br />
      <span class="hero__title-em">카드 컬렉션</span>
    </h1>
    <p class="hero__desc" id="intro"></p>

    <div class="hero__stats">
      <div class="stat">
        <strong id="statTotal">0</strong>
        <span>등록 카드</span>
      </div>
      <div class="stat">
        <strong id="statAvailable">0</strong>
        <span>판매중</span>
      </div>
      <div class="stat">
        <strong>2</strong>
        <span>종목</span>
      </div>
    </div>

    <div class="hero__cta">
      <a class="btn btn--ghost" href="#cards">카드 둘러보기</a>
      <button class="btn btn--kakao" type="button" data-inquire>오픈톡으로 구매 문의</button>
    </div>
  </section>

  <!-- ── 필터 & 검색 ──────────────────────────────────────── -->
  <section class="wrap controls" id="cards" aria-label="카드 검색 및 필터">
    <div class="controls__top">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16.5 16.5 21 21"/></svg>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="카드명 · 세트 · 인증번호 검색"
          aria-label="카드명, 세트, 인증번호 검색"
        />
        <button class="search__clear" id="searchClear" type="button" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <p class="controls__count" id="resultCount" role="status" aria-live="polite"></p>
    </div>

    <div class="filters">
      <div class="filter">
        <span class="filter__label">종목</span>
        <div class="chips" id="gameFilter" data-filter="game" role="group" aria-label="종목 필터"></div>
      </div>
      <div class="filter">
        <span class="filter__label">등급</span>
        <div class="chips" id="gradeFilter" data-filter="grade" role="group" aria-label="등급 필터"></div>
      </div>
      <div class="filter">
        <span class="filter__label">상태</span>
        <div class="chips" id="statusFilter" data-filter="status" role="group" aria-label="판매 상태 필터"></div>
      </div>
      <button class="btn btn--text" id="resetFilters" type="button">필터 초기화</button>
    </div>
  </section>

  <!-- ── 카드 그리드 ──────────────────────────────────────── -->
  <section class="wrap grid-section">
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty" id="emptyState" hidden>
      <p class="empty__title">조건에 맞는 카드가 없습니다</p>
      <p class="empty__desc">검색어를 줄이거나 필터를 초기화해 보세요.</p>
      <button class="btn btn--ghost btn--sm" type="button" id="emptyReset">필터 초기화</button>
    </div>
  </section>

  <!-- ── 거래 안내 ────────────────────────────────────────── -->
  <section class="wrap guide" id="guide">
    <div class="guide__head">
      <p class="guide__eyebrow">HOW IT WORKS</p>
      <h2 class="guide__title" id="guideTitle">거래 안내</h2>
      <p class="guide__intro" id="guideIntro"></p>
    </div>
    <div class="guide__grid" id="guideGrid"></div>
    <pre class="guide__notice" id="guideNotice"></pre>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__left">
      <strong id="footerShop"></strong>
      <p id="footerNote"></p>
    </div>
    <button class="btn btn--kakao btn--sm" type="button" data-inquire>오픈톡 문의</button>
  </div>
</footer>

<!-- ── 상세 모달 ──────────────────────────────────────────── -->
<div class="modal" id="detailModal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close" type="button" data-close aria-label="닫기">×</button>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<!-- ── 토스트 ─────────────────────────────────────────────── -->
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
