<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<title>ALL PO ONE — 검증 (임시)</title>
<style>body{background:#0b0d12;color:#cfd6e2;font:13px/1.5 monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running…</pre>
<script src="https://cdn.jsdelivr.net/npm/esprima@4.0.1/dist/esprima.js"></script>
<script type="module">
const out = [];
const log = (x) => { out.push(x); document.getElementById('out').textContent = out.join('\n'); };
window.__RESULT = null;

async function getText(url) {
  const r = await fetch(url + '?v=' + Date.now(), { cache: 'no-store' });
  return await r.text();
}

const result = { js: {}, sql: {}, cases: [], errors: [] };

/* ── 1. JS 문법 (esprima) ─────────────────────────────── */
for (const f of ['cards.js', 'store.js', 'app.js', 'shop.js', 'admin.js']) {
  try {
    const code = await getText(f);
    try {
      esprima.parseScript(code);
      result.js[f] = 'ok';
    } catch (e) {
      result.js[f] = 'ERR ' + e.message;
      result.errors.push(f + ': ' + e.message);
    }
  } catch (e) {
    result.js[f] = 'FETCH ' + e.message;
  }
}
log('JS: ' + JSON.stringify(result.js));

/* ── 2. PGlite: 스키마 + 패치 실행 ────────────────────── */
let pgcrypto = null;
try {
  const ext = await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.3.14/dist/contrib/pgcrypto.js');
  pgcrypto = ext.pgcrypto;
  result.sql.pgcrypto = 'loaded';
} catch (e) {
  result.sql.pgcrypto = 'unavailable: ' + e.message;
}
const PGliteMod = await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.3.14/dist/index.js');
const pg = pgcrypto ? new PGliteMod.PGlite({ extensions: { pgcrypto } }) : new PGliteMod.PGlite();
await pg.waitReady;

const prelude = `
create or replace function gen_random_bytes(int) returns bytea language sql as $f$
  select decode('00112233445566778899aabbccddeeff', 'hex') $f$;
do $a$ begin create role anon nologin; exception when duplicate_object then null; end $a$;
do $a$ begin create role authenticated nologin; exception when duplicate_object then null; end $a$;
create schema if not exists auth;
create table if not exists auth.users (
  id uuid primary key default gen_random_uuid(), email text,
  raw_user_meta_data jsonb default '{}'::jsonb, raw_app_meta_data jsonb default '{}'::jsonb,
  created_at timestamptz default now(), updated_at timestamptz default now());
create or replace function auth.uid() returns uuid language sql stable as $fn$
  select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $fn$;
create or replace function auth.jwt() returns jsonb language sql stable as $fn$
  select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $fn$;
create schema if not exists storage;
create table if not exists storage.buckets (id text primary key, name text, public boolean default true,
  file_size_limit bigint, allowed_mime_types text[]);
create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, name text, owner uuid);
grant usage on schema public to anon, authenticated;
`;

const runFile = async (name, label) => {
  let sql = await getText(name);
  /* PGlite 에는 pgcrypto 가 없어 검증용으로 줄만 지움 (gen_random_bytes 는 prelude 스텁) */
  sql = sql.replace(/create extension if not exists pgcrypto;/g, '');
  try {
    await pg.exec(sql);
    result.sql[label] = 'ok (' + sql.length + ' bytes)';
  } catch (e) {
    result.sql[label] = 'ERR ' + e.message;
    result.errors.push(label + ': ' + e.message);
  }
};

try {
  await pg.exec(prelude);
  result.sql.prelude = 'ok';
} catch (e) {
  result.errors.push('prelude: ' + e.message);
}

await runFile('supabase-schema.sql', 'schema');
await runFile('supabase-patch-oripa-seats.sql', 'patch1');
await runFile('supabase-patch-oripa-seats-2.sql', 'patch2');
/* 멱등성: 두 번째 실행 */
await runFile('supabase-patch-oripa-seats.sql', 'patch1(again)');
await runFile('supabase-patch-oripa-seats-2.sql', 'patch2(again)');
log('SQL: ' + JSON.stringify(result.sql));

/* ── 3. 도우미 ───────────────────────────────────────── */
const asAdmin = async () => { await pg.exec("set request.jwt.claims = '{\"app_metadata\":{\"role\":\"admin\"}}'"); };
const asGuest = async () => { await pg.exec("set request.jwt.claims = ''"); await pg.exec("set request.jwt.claim.sub = ''"); };
const q = async (sql, params) => (await pg.query(sql, params)).rows;
const caseRun = async (name, fn) => {
  try {
    const detail = await fn();
    result.cases.push({ name, ok: true, detail });
  } catch (e) {
    result.cases.push({ name, ok: false, error: e.message });
  }
};
const expect = (cond, msg, extra) => { if (!cond) throw new Error(msg + (extra === undefined ? '' : ' :: ' + JSON.stringify(extra))); };

/* 오리파 상품 하나 만들기 (사장님) */
await asAdmin();
await q("insert into public.products (id, name, type, game, price, stock, status, sort_order) values ('t-oripa','OP-05 오리파','oripa','onepiece',19900,0,'available',60) on conflict (id) do nothing");

await caseRun('총 구수 30 → 번호판 1~30 자동 생성', async () => {
  await asAdmin();
  const r = await q("select public.sync_oripa_tickets('t-oripa', 30) as j");
  const p = await q("select stock, total_slots from public.products where id='t-oripa'");
  const n = await q("select count(*)::int as c from public.oripa_tickets where product_id='t-oripa'");
  expect(n[0].c === 30, '티켓 30개가 아님', n);
  expect(p[0].stock === 30 && p[0].total_slots === 30, '재고/총구수 동기화 실패', p);
  return { sync: r[0].j, tickets: n[0].c, stock: p[0].stock };
});

await caseRun('손님 get_oripa_board — 30구 전부 선택 가능', async () => {
  await asGuest();
  const r = await q("select public.get_oripa_board('t-oripa') as j");
  const b = r[0].j;
  expect(b.total_slots === 30 && b.seats.length === 30, '번호판 크기 오류', b.total_slots);
  expect(b.available === 30 && b.held === 0 && b.sold === 0, '상태 카운트 오류', b);
  return { total: b.total_slots, available: b.available };
});

await caseRun('라인업 5등급 저장', async () => {
  await asAdmin();
  const items = JSON.stringify([
    { tier: 'dia', name: '루피 리더 패러렐 PSA 10', qty: 1 },
    { tier: 'gold', name: '샹크스 SR (일판)', qty: 3 },
    { tier: 'silver', name: '에이스 SR / 인기 패러렐', qty: 6 },
    { tier: 'bronze', name: '랜덤 SR · AR 1장', qty: 12 },
    { tier: 'last', name: 'OP-05 박스 1박스', qty: 1 }
  ]);
  const r = await q("select public.admin_save_oripa_lineup('t-oripa', $1::jsonb) as j", [items]);
  const b = r[0].j;
  expect(b.lineup.length === 5, '라인업 5개 아님', b.lineup);
  expect(b.lineup[0].tier === 'dia' && b.lineup[4].tier === 'last', '등급 순서 오류', b.lineup);
  return b.lineup.map((x) => x.tier + ':' + x.qty);
});

const customer = { name: '홍길동', phone: '010-1234-5678', postcode: '06236', address: '서울시 강남구 테헤란로 1', address_detail: '101동', memo: '' };

await caseRun('오리파 번호 3개 주문 → held + 재고 27 + 주문 JSON', async () => {
  await asGuest();
  const r = await q("select public.place_order($1::jsonb, $2::jsonb, 0) as j",
    [JSON.stringify(customer), JSON.stringify([{ product_id: 't-oripa', qty: 3, seat_numbers: [7, 19, 24] }])]);
  const o = r[0].j;
  const t = await q("select seat_no, status, order_id from public.oripa_tickets where product_id='t-oripa' and status='held' order by seat_no");
  const p = await q("select stock from public.products where id='t-oripa'");
  expect(o.items[0].seat_numbers.join(',') === '7,19,24', '주문 JSON seat_numbers 오류', o.items[0]);
  expect(t.length === 3, 'held 3개 아님', t);
  expect(p[0].stock === 27, '재고 27 아님', p);
  return { order_no: o.order_no, total: o.total_amount, stock: p[0].stock, held: t.map((x) => x.seat_no) };
});

await caseRun('같은 번호 동시 주문 → 차단 문구', async () => {
  await asGuest();
  try {
    await q("select public.place_order($1::jsonb, $2::jsonb, 0) as j",
      [JSON.stringify({ ...customer, name: '김철수', depositor: '김철수' }),
       JSON.stringify([{ product_id: 't-oripa', qty: 2, seat_numbers: [7, 19] }])]);
    throw new Error('차단되지 않음');
  } catch (e) {
    expect(/이미 선택된 번호가 있습니다: #7, #19/.test(e.message), '문구 불일치', e.message);
    const cnt = await q("select count(*)::int as c from public.orders");
    return { message: e.message, orders: cnt[0].c };
  }
});

await caseRun('디스코드 알림 문구에 번호 표시', async () => {
  const r = await q("select message from private.discord_log order by id");
  const joined = r.map((x) => x.message).join('\n---\n');
  expect(/OP-05 오리파 x3 \(#7, #19, #24\)/.test(joined), '디코 문구에 번호 없음', joined);
  return joined.split('\n')[0];
});

await caseRun('10분 미입금 자동취소 → 번호·재고 복구', async () => {
  await asGuest();
  await pg.exec("update public.orders set created_at = now() - interval '11 minutes' where status = 'pending_payment'");
  const r = await q("select public.expire_unpaid_orders() as j");
  const t = await q("select count(*)::int as c from public.oripa_tickets where product_id='t-oripa' and status='held'");
  const p = await q("select stock from public.products where id='t-oripa'");
  expect(r[0].j.expired === 1, '만료 1건 아님', r[0].j);
  expect(t[0].c === 0 && p[0].stock === 30, '복구 실패', { held: t[0].c, stock: p[0].stock });
  const board = (await q("select public.get_oripa_board('t-oripa') as j"))[0].j;
  return { expired: r[0].j.expired, stock: p[0].stock, available: board.available };
});

await caseRun('번호 2개 주문 → 입금확인 → sold 확정', async () => {
  await asGuest();
  const r = await q("select public.place_order($1::jsonb, $2::jsonb, 0) as j",
    [JSON.stringify(customer), JSON.stringify([{ product_id: 't-oripa', qty: 2, seat_numbers: [1, 2] }])]);
  const no = r[0].j.order_no;
  await asAdmin();
  const up = await q("select public.update_order_status($1, 'paid', null) as j", [no]);
  const t = await q("select seat_no, status from public.oripa_tickets where product_id='t-oripa' and seat_no in (1,2) order by seat_no");
  const p = await q("select stock from public.products where id='t-oripa'");
  expect(t.every((x) => x.status === 'sold'), 'sold 확정 안 됨', t);
  expect(p[0].stock === 28, '재고 28 아님', p);
  const disc = await q("select message from private.discord_log order by id desc limit 1");
  expect(/입금완료/.test(disc[0].message), '입금완료 알림 없음', disc[0].message);
  return { order_no: no, seats: t.map((x) => x.seat_no + ':' + x.status), stock: p[0].stock };
});

await caseRun('입금완료 주문 취소 → 번호 다시 열림', async () => {
  await asAdmin();
  const no = (await q("select order_no from public.orders where status='paid' order by created_at desc limit 1"))[0].order_no;
  await q("select public.update_order_status($1, 'cancelled', null) as j", [no]);
  const t = await q("select seat_no, status from public.oripa_tickets where product_id='t-oripa' and seat_no in (1,2) order by seat_no");
  const p = await q("select stock from public.products where id='t-oripa'");
  expect(t.every((x) => x.status === 'available'), '복구 안 됨', t);
  expect(p[0].stock === 30, '재고 30 아님', p);
  return { seats: t.map((x) => x.seat_no + ':' + x.status), stock: p[0].stock };
});

await caseRun('총 구수 30 → 20으로 줄여도 팔린 번호는 유지', async () => {
  await asAdmin();
  await q("update public.oripa_tickets set status='sold' where product_id='t-oripa' and seat_no=25");
  const r = await q("select public.sync_oripa_tickets('t-oripa', 20) as j");
  const keep = await q("select seat_no, status from public.oripa_tickets where product_id='t-oripa' and seat_no=25");
  const max = await q("select max(seat_no)::int as m from public.oripa_tickets where product_id='t-oripa' and status='available'");
  expect(keep.length === 1 && keep[0].status === 'sold', '팔린 번호가 지워짐', keep);
  expect(max[0].m === 20, 'available 최대 20 아님', max);
  return { sync: r[0].j, keep: keep[0].seat_no, maxAvailable: max[0].m };
});

await caseRun('일반 상품 주문은 그대로 동작(회귀)', async () => {
  await asGuest();
  const r = await q("select public.place_order($1::jsonb, $2::jsonb, 0) as j",
    [JSON.stringify(customer), JSON.stringify([{ product_id: 'box-terastal-festival-jp', qty: 1 }])]);
  const o = r[0].j;
  expect(o.items[0].seat_numbers.length === 0, '일반 상품에 번호가 붙음', o.items[0]);
  expect(o.total_amount === 320000, '금액 오류', o.total_amount);
  return { order_no: o.order_no, total: o.total_amount, seats: o.items[0].seat_numbers };
});

await caseRun('번호판 없는 상품은 총 구수 0 (클라이언트 폴백)', async () => {
  await asGuest();
  const b = (await q("select public.get_oripa_board('oripa-op05-jp') as j"))[0].j;
  expect(b.total_slots === 0, '총 구수가 0이 아님', b.total_slots);
  return { total_slots: b.total_slots, seats: b.seats.length };
});

await caseRun('범위 밖 번호는 차단', async () => {
  await asGuest();
  try {
    await q("select public.place_order($1::jsonb, $2::jsonb, 0) as j",
      [JSON.stringify(customer), JSON.stringify([{ product_id: 't-oripa', qty: 1, seat_numbers: [99] }])]);
    throw new Error('차단되지 않음');
  } catch (e) {
    expect(/이미 선택된 번호가 있습니다/.test(e.message), '문구 불일치', e.message);
    return e.message;
  }
});

log('cases: ' + result.cases.filter((c) => c.ok).length + '/' + result.cases.length + ' ok');
window.__RESULT = result;
log(JSON.stringify(result, null, 1));
</script>
</body>
</html>
